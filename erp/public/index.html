
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint Factory ERP</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <!-- ============ LOGIN / LOCK SCREEN ============ -->
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-box" autocomplete="off">
        <div class="login-title">PAINT FACTORY ERP</div>
        <div class="login-sub">Offline System &mdash; Local Database</div>
        <label>User Name</label>
        <input id="login-user" type="text" autofocus />
        <label>Password</label>
        <input id="login-pass" type="password" />
        <button type="submit" class="btn-primary">Enter</button>
        <div id="login-error" class="login-error"></div>
        <div class="login-hint">Default: admin / admin</div>
      </form>
    </div>

    <!-- ============ APP SHELL ============ -->
    <div id="app" class="app hidden">
      <header class="titlebar">
        <span class="titlebar-name">Paint Factory ERP</span>
        <span class="titlebar-screen" id="screen-title">Main Menu</span>
        <span class="titlebar-right">
          <span id="user-label"></span>
          <button id="btn-logout" class="btn-tiny">Lock</button>
        </span>
      </header>

      <div class="body">
        <nav class="ribbon" id="ribbon"></nav>
        <main class="content" id="content"></main>
      </div>

      <footer class="statusbar">
        <span id="status-left">Ready</span>
        <span id="status-right"></span>
      </footer>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
